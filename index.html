<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BAZELET">
  <meta name="application-name" content="BAZELET">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <title>BAZELET House Manager</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f7fbff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }
    main {
      text-align: center;
      color: #0b2d63;
    }
    img {
      width: min(56vw, 240px);
      height: auto;
      display: block;
      margin: 0 auto 18px;
      border-radius: 22%;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      letter-spacing: .04em;
    }
    p {
      margin: 0 0 22px;
      font-size: 16px;
      opacity: .72;
    }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: #0b2d63;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="./apple-touch-icon.png" alt="BAZELET">
    <h1>BAZELET</h1>
    <p>House Manager</p>
    <a id="openApp" href="https://script.google.com/macros/s/AKfycbzXUOdk8h5EGUmGmZ1RUAiCYSYridWf34YpemRxlP_D2FKm_WuZ1gLWTfQYy44ef0la/exec" target="_top" rel="noopener">פתיחת האפליקציה</a>
  </main>

  <script>
    (function () {
      var target = 'https://script.google.com/macros/s/AKfycbzXUOdk8h5EGUmGmZ1RUAiCYSYridWf34YpemRxlP_D2FKm_WuZ1gLWTfQYy44ef0la/exec';

      function openBazelet() {
        try {
          window.top.location.href = target;
        } catch (e) {
          window.location.href = target;
        }
      }

      window.addEventListener('load', function () {
        setTimeout(openBazelet, 350);
      });
    })();
  </script>
</body>
</html>
