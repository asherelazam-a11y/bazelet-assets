<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BAZELET">
<meta name="application-name" content="BAZELET">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v4.png">
<link rel="icon" type="image/png" href="./apple-touch-icon-v4.png">
<title>BAZELET House Manager</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
.install{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  background:radial-gradient(circle at 50% 0,rgba(225,239,255,.75),transparent 42%),#f7fbff
}
main{width:min(92vw,430px);text-align:center;color:#0b2d63}
.logo{width:min(61vw,260px);height:auto;display:block;margin:0 auto 20px;border-radius:22%;box-shadow:0 14px 30px rgba(11,45,99,.14)}
h1{margin:0 0 6px;font-size:34px;font-weight:900;letter-spacing:.05em}
.sub{margin:0 0 27px;font-size:19px;color:#557095}
.divider{width:110px;height:2px;margin:0 auto 25px;border-radius:999px;background:linear-gradient(90deg,transparent,#b9d5f6,transparent)}
.hint{margin:0 auto 27px;max-width:380px;color:#173c72;font-size:17px;line-height:1.75;text-align:center}
.hint strong{font-weight:800}
.open-app{display:inline-flex;align-items:center;justify-content:center;min-width:235px;padding:14px 24px;border-radius:14px;background:linear-gradient(135deg,#0b2d63,#123e82);color:#fff;text-decoration:none;font-size:16px;font-weight:800;box-shadow:0 10px 24px rgba(11,45,99,.18)}

.launch{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;
  padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse at 50% -8%,rgba(24,88,184,.72) 0%,rgba(7,31,70,.46) 29%,rgba(2,9,22,.97) 67%),
    linear-gradient(180deg,#071a38 0%,#020914 55%,#00040b 100%);
  z-index:1000;color:#fff
}
.launch:before,.launch:after{
  content:"";position:absolute;left:-22%;right:-22%;height:220px;border-radius:50%;transform:rotate(-7deg);
  pointer-events:none;border:1px solid rgba(232,180,73,.32)
}
.launch:before{bottom:14%;box-shadow:0 0 18px rgba(232,180,73,.10)}
.launch:after{bottom:6%;left:-30%;right:-6%;border-color:rgba(232,180,73,.18)}
.launch-inner{position:relative;z-index:2;width:min(100%,520px);text-align:center;transform:translateY(-2vh)}
.launch-logo{
  width:min(72vw,310px);height:auto;display:block;margin:0 auto 26px;border-radius:24%;
  box-shadow:0 22px 58px rgba(0,0,0,.48),0 0 40px rgba(35,113,255,.12)
}
.launch-title{font-size:clamp(32px,8vw,44px);font-weight:900;letter-spacing:.08em;color:#e9c16e;margin:0 0 5px;direction:ltr}
.launch-sub{font-size:19px;letter-spacing:.04em;color:#f5f7fb;margin:0;direction:ltr}
.launch-tag{margin-top:20px;font-size:20px;line-height:1.32;color:#f5f7fb;direction:ltr}
.launch-tag .gold{color:#e8b44a}
body.standalone .install{display:none}
body.standalone .launch{display:flex}
</style>
</head>
<body>
<section class="install">
<main>
<img class="logo" src="./apple-touch-icon-v4.png" alt="BAZELET House Manager">
<h1>BAZELET</h1>
<p class="sub">House Manager</p>
<div class="divider"></div>
<div class="hint"><strong>באייפון:</strong><br>הוסף את העמוד הזה למסך הבית.<br>לאחר ההתקנה, פתיחה מהאייקון תעביר אוטומטית<br>למערכת BAZELET.</div>
<a class="open-app" href="https://script.google.com/macros/s/AKfycbzXUOdk8h5EGUmGmZ1RUAiCYSYridWf34YpemRxlP_D2FKm_WuZ1gLWTfQYy44ef0la/exec" target="_top" rel="noopener">פתיחת האפליקציה עכשיו</a>
</main>
</section>

<section class="launch" aria-hidden="true">
<div class="launch-inner">
<img class="launch-logo" src="./apple-touch-icon-v4.png" alt="">
<div class="launch-title">BAZELET</div>
<p class="launch-sub">House Manager</p>
<div class="launch-tag">
  <div>Smart Management.</div>
  <div class="gold">Stronger Communities.</div>
</div>
</div>
</section>

<script>
(function(){
  var standalone=
    (window.navigator&&window.navigator.standalone===true)||
    (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);

  if(!standalone) return;

  document.body.classList.add('standalone');

  window.setTimeout(function(){
    try{window.top.location.replace('https://script.google.com/macros/s/AKfycbzXUOdk8h5EGUmGmZ1RUAiCYSYridWf34YpemRxlP_D2FKm_WuZ1gLWTfQYy44ef0la/exec');}
    catch(e){window.location.replace('https://script.google.com/macros/s/AKfycbzXUOdk8h5EGUmGmZ1RUAiCYSYridWf34YpemRxlP_D2FKm_WuZ1gLWTfQYy44ef0la/exec');}
  },80);
})();
</script>
</body>
</html>
