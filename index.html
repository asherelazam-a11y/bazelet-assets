<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#061629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BAZELET">
<meta name="application-name" content="BAZELET">

<link rel="manifest" href="./manifest.webmanifest?v=20260821-2">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v5.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-v5.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v2.png">

<title>BAZELET House Manager</title>

<style>
* {
  box-sizing: border-box;
}

html {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #061629;
}

body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background: #061629;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

/*
 * This page is shown only when opened normally in a browser.
 * When launched from the installed Home Screen icon,
 * JavaScript redirects immediately to BAZELET.
 */
.install {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px 18px;
  background:
    radial-gradient(
      circle at 50% 0,
      rgba(225,239,255,.75),
      transparent 42%
    ),
    #f7fbff;
}

main {
  width: min(92vw, 430px);
  text-align: center;
  color: #0b2d63;
}

.logo {
  width: min(61vw, 260px);
  height: auto;
  display: block;
  margin: 0 auto 20px;
  border-radius: 22%;
  box-shadow: 0 14px 30px rgba(11,45,99,.14);
}

h1 {
  margin: 0 0 6px;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: .05em;
}

.sub {
  margin: 0 0 27px;
  font-size: 19px;
  color: #557095;
}

.divider {
  width: 110px;
  height: 2px;
  margin: 0 auto 25px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    transparent,
    #b9d5f6,
    transparent
  );
}

.hint {
  margin: 0 auto 27px;
  max-width: 380px;
  color: #173c72;
  font-size: 17px;
  line-height: 1.75;
  text-align: center;
}

.open-app {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 235px;
  padding: 14px 24px;
  border-radius: 14px;
  background: #0b2d63;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 800;
}

/*
 * Critical first paint for installed iPhone/iPad launcher.
 * No white page and no legacy splash.
 */
html.standalone,
html.standalone body {
  background: #061629 !important;
}

html.standalone body {
  visibility: hidden;
}
</style>

<script>
(function () {
  var standalone =
    (
      window.navigator &&
      window.navigator.standalone === true
    ) ||
    (
      window.matchMedia &&
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches
    );

  /*
   * Normal browser visit:
   * leave the installation page visible.
   */
  if (!standalone) {
    return;
  }

  /*
   * Installed launcher:
   * paint navy immediately and redirect once.
   */
  document.documentElement.classList.add(
    'standalone'
  );

  document.documentElement.style.background =
    '#061629';

  var target =
    'https://script.google.com/macros/s/AKfycbzXUOdk8h5EGUmGmZ1RUAiCYSYridWf34YpemRxlP_D2FKm_WuZ1gLWTfQYy44ef0la/exec';

  /*
   * Preserve the existing BAZELET device identity.
   * This is required by the Apps Script authorization flow.
   */
  var key =
    'bazeletLauncherDeviceV427';

  var device = '';

  try {
    device =
      localStorage.getItem(key) || '';
  } catch (error) {}

  if (
    !/^[A-Za-z0-9._:-]{16,160}$/.test(
      device
    )
  ) {
    var randomPart = '';

    try {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
          'function'
      ) {
        randomPart =
          window.crypto.randomUUID();
      }
    } catch (error) {}

    if (!randomPart) {
      randomPart =
        Date.now().toString(36) +
        '-' +
        Math.random()
          .toString(36)
          .slice(2) +
        '-' +
        Math.random()
          .toString(36)
          .slice(2);
    }

    device =
      'bazelet-' + randomPart;

    try {
      localStorage.setItem(
        key,
        device
      );
    } catch (error) {}
  }

  /*
   * ONE redirect only.
   * No timeout.
   * No legacy launch screen.
   */
  window.location.replace(
    target +
    '?bazeletDevice=' +
    encodeURIComponent(device)
  );
})();
</script>
</head>

<body>

<section class="install">
  <main style="
    width:min(92vw,520px);
    margin:0 auto;
    text-align:center;
    direction:rtl;
  ">

    <img
      class="logo"
      src="./icon-512.png"
      alt="BAZELET House Manager"
      style="
        width:min(48vw,210px);
        height:auto;
        display:block;
        margin:0 auto 18px;
        border-radius:24%;
      "
    >

    <h1 style="
      margin:0;
      color:#123d78;
      font-size:clamp(38px,10vw,54px);
      line-height:1;
      font-weight:900;
      letter-spacing:.04em;
      direction:ltr;
    ">BAZELET</h1>

    <div style="
      width:112px;
      height:3px;
      margin:12px auto 9px;
      border-radius:99px;
      background:#367bc1;
    "></div>

    <div style="
      color:#28659d;
      font-size:19px;
      font-weight:700;
      margin-bottom:30px;
    ">ניהול בתים חכם</div>

    <section style="
      color:#172536;
      font-size:17px;
      line-height:1.45;
    ">

      <div style="
        color:#123d78;
        font-size:20px;
        font-weight:800;
        margin:0 0 10px;
      ">להתקנת האפליקציה במסך הבית:</div>

      <div style="margin:0 0 3px;">
        הוסף אייקון <strong>BAZELET</strong> למסך הבית במכשיר שלך כך:
      </div>

      <div style="margin:0 0 3px;">
        <strong>באייפון</strong> – לחיצה על&nbsp;&nbsp;”...“ ואז בחר ”שיתוף“
        <br>
        ואז ”הוסף למסך הבית“.
      </div>

      <div style="margin:0 0 3px;">
        <strong>באנדרואיד</strong> – לחיצה על ”⋮“ ואז בחר ”הוסף דף ל-“ 
        <br>
        ואז ”מסך הבית“.
      </div>

      <div style="margin:0;">
        לאחר ההתקנה, פתיחה מהאייקון תעביר אוטומטית למערכת <strong>BAZELET</strong>.
      </div>

    </section>
  </main>
</section>

</body>
</html>
